<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 Not Found</title>
        <link rel="stylesheet" href="/style/main.css">
        <link rel="stylesheet" href="/style/404.css">
    </head>
    <body class="center column">
        <img src="resource/warning.png" style="width: 25vh;">
        <h1>404 Page Not Found</h1>
        <h3>Unfortunately, it seems the page you're looking for doesn't exist or currently is in construction.</h3>
        <div id="goBackBtn" class="h4button center row" onclick="window.history.back()">
            <div id="goBackIcon" class="hoverIcon"></div>
            <h4>Go Back</h4>
        </div>
    </body>

</html>

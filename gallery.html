<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gallery</title>
        <link rel="stylesheet" href="/style/main.css">
        <link rel="stylesheet" href="/style/gallery.css">
        <script src="/script/main.js" type="application/javascript"></script>
        <script src="/script/gallery.js" type="application/javascript"></script>
    </head>

    <body class="center column">
        <div id="construction" style="background-color: red; margin: 10vh;">
            <h1>Under Construction</h1><br>
            <h3>This page is currently being worked on. Not all the features may work correctly.</h3>
        </div>
        <header class="center row" id="header">
            <nav class="center row">
                <a href="/">
                    <img src="/resource/home.svg" id="home" title="Home" />
                </a>
                <h1 style="margin: 0;">Gallery</h1>
                <div>
                    <img src="/resource/order.svg" id="order" title="Order" />
                    <img src="/resource/filter.svg" id="filter" title="Filter" />
                </div>
            </nav>
        </header>
        <div id="filterList" class="center row">
            <div class="filter center row" id="arptFilter">
                <h5 style="margin: 0;margin-right: 0.5ch;">
                </h5>
                <img src="/resource/x.svg" class="filterRemoveBtn" onclick="removeFilter('arpt')">
            </div>
            <div class="filter center row" id="acftFilter">
                <h5 style="margin: 0;margin-right: 0.5ch;">
                </h5>
                <img src="/resource/x.svg" class="filterRemoveBtn" onclick="removeFilter('acft')">
            </div>
            <div class="filter center row" id="lvryFilter">
                <h5 style="margin: 0;margin-right: 0.5ch;">
                </h5>
                <img src="/resource/x.svg" class="filterRemoveBtn" onclick="removeFilter('lvry')">
            </div>
            <div class="filter center row" id="startFilter">
                <h5 style="margin: 0;margin-right: 0.5ch;">
                </h5>
                <img src="/resource/x.svg" class="filterRemoveBtn" onclick="removeFilter('start')">
            </div>
            <div class="filter center row" id="endFilter">
                <h5 style="margin: 0;margin-right: 0.5ch;">
                </h5>
                <img src="/resource/x.svg" class="filterRemoveBtn" onclick="removeFilter('end')">
            </div>
        </div>
        <main id="gallery">
        </main>
        <div id="topBtn" class="center column"
            onclick="document.querySelector('html').scrollTo({top:0, behavior:'smooth'})">
            <h4 style="margin: 0;">↑<br>Top</h4>
        </div>
        <footer>
            <h3>Copyright 2026~ Seungwoo Yi. All rights reserved</h3>
        </footer>
    </body>

</html>
